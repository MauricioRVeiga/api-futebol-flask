services:
  db:
    image: postgres:15
    container_name: api-futebol-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: futebol_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d futebol_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: api-futebol-app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/futebol_db
      AUTO_CREATE_TABLES: "true"
      DB_INIT_RETRIES: "10"
      DB_INIT_DELAY: "2"
      FLASK_APP: run.py
      FLASK_DEBUG: "false"
      PYTHONUNBUFFERED: "1"

volumes:
  postgres_data:
